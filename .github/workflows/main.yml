name: Build VST3 + Standalone (Windows, ASIO)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unduh ASIO SDK (Steinberg)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "ThirdParty/asiosdk/common/iasiodrv.h") { Write-Host "ASIO SDK sudah ada di repo"; exit 0 }
          $ok = $false
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile asio.zip -UserAgent "Mozilla/5.0"
              $ok = $true; break
            } catch { Write-Warning "Unduhan ASIO SDK gagal (percobaan $i): $_"; Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { throw "ASIO SDK tidak bisa diunduh" }
          Expand-Archive asio.zip -DestinationPath asio_tmp
          $dir = Get-ChildItem asio_tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ThirdParty | Out-Null
          Move-Item $dir.FullName ThirdParty/asiosdk
          if (-not (Test-Path "ThirdParty/asiosdk/common/iasiodrv.h")) { throw "iasiodrv.h tidak ditemukan setelah ekstrak" }
          Write-Host "ASIO SDK siap"

      # Runner windows-latest sekarang memakai Visual Studio 2026 (bukan 2022), jadi generator
      # "Visual Studio 17 2022" tidak ditemukan. Solusi: pakai Ninja + compiler MSVC apa pun yang terpasang.
      - name: Siapkan MSVC (versi Visual Studio apa pun)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pastikan Ninja & CMake ada
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install ninja }
          ninja --version
          cmake --version
          where.exe cl

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Kumpulkan hasil
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "build/LRProAudioDevice_artefacts/Release"
          Get-ChildItem -Recurse "build/LRProAudioDevice_artefacts" -Include *.vst3,*.exe | Select-Object -ExpandProperty FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($f in @("VST3", "Standalone")) {
            if (-not (Test-Path "$base/$f")) { throw "Hasil build tidak ditemukan: $base/$f" }
            Copy-Item -Recurse "$base/$f" "dist/$f"
          }
          Get-ChildItem -Recurse dist | Select-Object -First 30 FullName

      - uses: actions/upload-artifact@v4
        with:
          name: LR_PRO_AUDIO_DEVICE_windows
          path: dist
          if-no-files-found: error
